<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Carregamento do Skull</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            font-size: 14px;
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
            color: #ff6b6b;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        label {
            display: inline-block;
            width: 80px;
            font-size: 12px;
        }
        
        input[type="range"] {
            width: 100px;
            margin: 0 10px;
        }
        
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading" class="loading">Carregando skull...</div>
        
        <div id="controls" style="display: none;">
            <h3>Controles do Skull</h3>
            
            <div class="control-group">
                <label>Posição X:</label>
                <input type="range" id="posX" min="-5" max="5" step="0.1" value="0">
                <span id="posXValue">0</span>
            </div>
            
            <div class="control-group">
                <label>Posição Y:</label>
                <input type="range" id="posY" min="-5" max="5" step="0.1" value="0">
                <span id="posYValue">0</span>
            </div>
            
            <div class="control-group">
                <label>Posição Z:</label>
                <input type="range" id="posZ" min="-5" max="5" step="0.1" value="0">
                <span id="posZValue">0</span>
            </div>
            
            <div class="control-group">
                <label>Rotação X:</label>
                <input type="range" id="rotX" min="0" max="6.28" step="0.1" value="1.57">
                <span id="rotXValue">1.57</span>
            </div>
            
            <div class="control-group">
                <label>Rotação Y:</label>
                <input type="range" id="rotY" min="0" max="6.28" step="0.1" value="0">
                <span id="rotYValue">0</span>
            </div>
            
            <div class="control-group">
                <label>Rotação Z:</label>
                <input type="range" id="rotZ" min="0" max="6.28" step="0.1" value="0">
                <span id="rotZValue">0</span>
            </div>
            
            <div class="control-group">
                <label>Escala:</label>
                <input type="range" id="scale" min="0.1" max="2" step="0.1" value="0.3">
                <span id="scaleValue">0.3</span>
            </div>
            
            <div class="control-group">
                <button id="resetBtn">Reset</button>
                <button id="animateBtn">Animar</button>
            </div>
        </div>
        
        <div id="info">
            <div>Use os controles para manipular o skull</div>
            <div>Clique e arraste para rotacionar a câmera</div>
            <div>Scroll para zoom</div>
        </div>
    </div>
      <script type="importmap"> 
         {"imports": {"three": "../build/three.module.js"}} 
      </script>  
    <script type="module" src="skull-test.js"></script>
</body>
</html>
